[tool.ruff]
line-length = 160
target-version = "py311"

[tool.ruff.lint]
# Correctness rules: syntax errors, pyflakes, and the bugbear set. Style is not gated.
select = ["E9", "F", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.report]
fail_under = 85
