# Monthly, grouped update proposals for pinned dependencies and workflow actions.
version: 2
updates:
  - package-ecosystem: pip
    directories: ["/", "/agent"]
    schedule: {interval: monthly}
    groups:
      python: {patterns: ["*"]}
    open-pull-requests-limit: 2
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: monthly}
    groups:
      actions: {patterns: ["*"]}
    open-pull-requests-limit: 1
