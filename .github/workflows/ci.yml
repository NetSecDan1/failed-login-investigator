# Quality gates. Every job must pass before a change is considered releasable.
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    name: unit tests and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13", cache: pip}
      - run: pip install -r requirements-dev.txt
      - run: python tools/build_skill_index.py --check
      - run: python -m pytest -q --cov=src --cov=agent --cov-report=term-missing tests
  evaluation:
    name: offline evaluation (golden cases and adversarial suite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - name: Golden cases with a scripted stand-in model (code path only)
        run: python tools/run_evals.py --json golden-scorecard.json
      - name: Adversarial suite with scripted hostile models
        run: python tools/redteam.py | tee adversarial-scorecard.txt
      - uses: actions/upload-artifact@v4
        with:
          name: evaluation-${{ github.sha }}
          path: |
            golden-scorecard.json
            adversarial-scorecard.txt
          retention-days: 30
  lint:
    name: lint (correctness rules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: pip install ruff==0.17.5
      - run: ruff check .
      - run: bash -n deploy.sh run_tests.sh teardown.sh
  static-security:
    name: static security analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: pip install bandit==1.9.4
      - name: Shipped code, all severities
        run: bandit -q -r src agent integrations
      - name: Developer tools, medium and above
        run: bandit -q -ll -r tools
  dependencies:
    name: dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: pip install pip-audit==2.10.1
      - run: pip-audit -r agent/requirements.txt
      - run: pip-audit -r agent/constraints.txt
      - run: pip-audit -r integrations/requirements.txt
  secrets:
    name: secret scan (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 detect --source /repo --redact --no-banner
  infrastructure:
    name: infrastructure template lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: pip install cfn-lint==1.60.1
      - run: cfn-lint template.yaml infra/github-oidc.yaml
  container:
    name: agent container build, smoke test and vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the agent image
        run: docker build -f agent/Dockerfile -t fli-agent:ci .
      - name: Image runs as a non-root user
        run: test "$(docker run --rm fli-agent:ci id -u)" = "10001"
      - name: Application starts and refuses a request with no verified identity
        run: |
          docker run --rm fli-agent:ci python -c "
          from agent.app import build_app, run
          build_app()
          out = run({'action': 'investigate', 'account': 'svc-batch01', 'claims': {'employee_id': 'E1001'}}, {})
          assert out['status'] == 'denied' and out['reason'] == 'unauthenticated', out
          print('refused as expected:', out['reason'])"
      - name: Where patched packages live in the image
        run: |
          docker run --rm fli-agent:ci sh -c "find / -xdev \\( -iname 'urllib3-*' -o -iname 'msgpack-*' -o -iname 'setuptools-*' -o -iname 'pip-*' \\) 2>/dev/null | head -30; python -c 'import urllib3; print(urllib3.__version__)'"
      - name: Vulnerability scan (blocks on fixable high and critical findings)
        run: |
          set -o pipefail
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            ghcr.io/aquasecurity/trivy@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb \
            image --severity HIGH,CRITICAL --ignore-unfixed --no-progress --exit-code 1 fli-agent:ci | tee image-vulnerabilities.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: image-vulnerabilities-${{ github.sha }}
          path: image-vulnerabilities.txt
          if-no-files-found: ignore
          retention-days: 30
  package:
    name: build artifact with checksums and a software bill of materials
    needs: [test, evaluation, lint, static-security, dependencies, secrets, infrastructure, container]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - name: Build function package
        run: |
          (cd src && zip -qr ../function.zip . -x '__pycache__/*') && zip -qr function.zip queries config
          tar -czf skills.tar.gz skills
          python -m venv .sbom && .sbom/bin/pip install -q -r agent/requirements.txt
          .sbom/bin/pip freeze > agent-dependency-inventory.txt
          pip install -q cyclonedx-bom==8.0.1
          cyclonedx-py environment .sbom --output-format JSON --output-file agent-sbom.cdx.json
          # A ready-to-upload bundle: template, function package, bucket contents and test events.
          python tools/build_skill_index.py --check && python tools/make_data.py
          mkdir -p console-bundle/bucket console-bundle/test-events
          cp template.yaml function.zip docs/DEPLOY_CONSOLE.md console-bundle/
          cp -r skills console-bundle/bucket/skills && cp -r data/ownership data/evidence console-bundle/bucket/
          cp examples/events/*.json console-bundle/test-events/
          sha256sum function.zip skills.tar.gz agent-dependency-inventory.txt agent-sbom.cdx.json > SHA256SUMS
          echo "commit ${GITHUB_SHA}" >> SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate-${{ github.sha }}
          path: |
            function.zip
            skills.tar.gz
            agent-dependency-inventory.txt
            agent-sbom.cdx.json
            SHA256SUMS
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: console-bundle-${{ github.sha }}
          path: console-bundle/
          retention-days: 30
