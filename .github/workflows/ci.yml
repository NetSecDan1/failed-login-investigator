name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pytest cfn-lint
      - run: python tools/make_data.py
      - run: python -m pytest -q tests
      - run: cfn-lint template.yaml
      - run: bash -n deploy.sh run_tests.sh teardown.sh
